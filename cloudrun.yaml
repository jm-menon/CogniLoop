apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cogniloop
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "CogniLoop - Quantum-Guarded Cognitive Thinking Engine with DBT Context Reference"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/cogniloop:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        # Optional: Set GEMINI_API_KEY if desired:
        # - name: GEMINI_API_KEY
        #   value: "YOUR_GEMINI_API_KEY"
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
